[build]
  # Publish only the static page; netlify/server holds server code and must not be served as files.
  command = "mkdir -p dist && cp index.html dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache"
